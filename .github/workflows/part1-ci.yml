name: Part 1 Documentation Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-part1:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check docs folder exists
      run: test -d docs

    - name: Check ERD exists
      run: test -f docs/RaceDay_ERD.pdf

    - name: Check API Endpoint Plan exists
      run: test -f docs/RaceDay_API_Endpoint_Plan.pdf

    - name: Check SQL Script exists
      run: test -f docs/RaceDay_Database.sql

    - name: Check README exists
      run: test -f README.md

    - name: All checks passed
      run: echo "✅ All Part 1 documentation files present!"
